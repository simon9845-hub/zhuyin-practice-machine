<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛注音練習機 - 玩注音</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
	body {
            font-family: '微軟正黑體', 'Arial', sans-serif;
            background-color: #ffe4e1; /* 夢幻粉色背景 */
            color: #5d4037;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #fff0f5; /* 略淺的粉色容器 */
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4); /* 粉色陰影 */
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #ff69b4; /* 亮粉紅色標題 */
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px #fff;
        }

        .game-area {
            border: 5px solid #ffb6c1; /* 淺粉色邊框 */
            border-radius: 15px;
            padding: 20px;
            background-color: #fff;
        }

        .question-box {
            margin-bottom: 20px;
        }

        #word-display {
            font-size: 3em;
            font-weight: bold;
            color: #e91e63; /* 櫻桃紅色字體 */
            margin-bottom: 10px;
            min-height: 50px; /* 確保沒有題目時也有空間 */
        }

        #listen-again {
            background-color: #ffc0cb; /* 粉紅按鈕 */
            color: #880e4f;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px #ff80a0;
        }

        #listen-again:hover {
            background-color: #ff80a0;
        }
        
        /* 輸入區塊 */
        .input-area {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #d81b60; /* 深粉色標籤 */
        }

        #zhuyin-input {
            width: 80%;
            padding: 12px;
            font-size: 1.5em;
            text-align: center;
            border: 3px solid #f8bbd0;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #880e4f;
        }

        /* 按鈕群組 */
        .button-group {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap; /* 換行以適應小螢幕 */
        }

        .button-group button {
            flex-grow: 1;
            margin: 5px;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .button-group button:active {
            transform: translateY(2px);
            box-shadow: none !important;
        }

        .btn-check {
            background-color: #90ee90; /* 淺綠色 (答題) */
            color: #1b5e20;
            box-shadow: 0 4px #66bb6a;
        }

        .btn-check:hover {
            background-color: #66bb6a;
        }

        .btn-clear {
            background-color: #add8e6; /* 淺藍色 (清除) */
            color: #01579b;
            box-shadow: 0 4px #4fc3f7;
        }

        .btn-clear:hover {
            background-color: #4fc3f7;
        }
        
        .btn-next {
            background-color: #ffb6c1; /* 淺粉色 (下一題) */
            color: #880e4f;
            box-shadow: 0 4px #ff80a0;
        }

        .btn-next:hover {
            background-color: #ff80a0;
        }

        /* 答題回饋區 */
        #message {
            margin-top: 15px;
            font-size: 1.4em;
            font-weight: bold;
            min-height: 30px;
            color: #ff69b4; /* 預設回饋顏色 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 可愛注音拼音練習 🌟</h1>
        <div class="game-area">
            <div class="question-box">
                <p id="word-display">點擊開始練習</p>
                <button id="listen-again" title="再聽一次"><i class="fas fa-volume-up"></i> 再聽一次</button>
            </div>
            
            <div class="input-area">
                <label for="zhuyin-input">請輸入注音拼音 (含聲調):</label>
                <input type="text" id="zhuyin-input" placeholder="例如：ㄉㄚˋ" maxlength="5">
                <div class="button-group">
                    <button id="check-answer" class="btn-check"><i class="fas fa-check"></i> 送出答案</button>
                    <button id="clear-input" class="btn-clear"><i class="fas fa-trash-alt"></i> 全部清除</button>
                    <button id="next-word" class="btn-next"><i class="fas fa-arrow-right"></i> 下一題</button>
                </div>
            </div>
            
            <div class="feedback-area">
                <p id="message">準備好了嗎？點擊「下一題」開始！</p>
            </div>
        </div>
    </div>

    <script>
	// 題庫：國小或幼兒常見詞彙
        // 格式：{ word: "詞彙", zhuyin: "注音拼音", pronunciation: "發音(給語音API用)" }
        const questions = [
            { word: "媽媽", zhuyin: "ㄇㄚㄇㄚ˙", pronunciation: "媽媽" },
            { word: "爸爸", zhuyin: "ㄅㄚˋㄅㄚ˙", pronunciation: "爸爸" },
            { word: "蘋果", zhuyin: "ㄆㄧㄥˊㄍㄨㄛˇ", pronunciation: "蘋果" },
            { word: "香蕉", zhuyin: "ㄒㄧㄤㄐㄧㄠ", pronunciation: "香蕉" },
            { word: "狗狗", zhuyin: "ㄍㄡˇㄍㄡ˙", pronunciation: "狗狗" },
            { word: "貓咪", zhuyin: "ㄇㄠㄇㄧ", pronunciation: "貓咪" },
            { word: "太陽", zhuyin: "ㄊㄞˋㄧㄤˊ", pronunciation: "太陽" },
            { word: "月亮", zhuyin: "ㄩㄝˋㄌㄧㄤˋ", pronunciation: "月亮" },
            { word: "開車", zhuyin: "ㄎㄞㄔㄜ", pronunciation: "開車" },
            { word: "氣球", zhuyin: "ㄑㄧˋㄑㄧㄡˊ", pronunciation: "氣球" },
            { word: "鉛筆", zhuyin: "ㄑㄧㄢㄅㄧˇ", pronunciation: "鉛筆" },
            { word: "玩具", zhuyin: "ㄨㄢˊㄐㄩˋ", pronunciation: "玩具" },
            { word: "吃飯", zhuyin: "ㄔㄈㄢˋ", pronunciation: "吃飯" },
            { word: "睡覺", zhuyin: "ㄕㄨㄟˋㄐㄧㄠˋ", pronunciation: "睡覺" },
            { word: "好棒", zhuyin: "ㄏㄠˇㄅㄤˋ", pronunciation: "好棒" },
        ];

        let currentQuestion = null;
        let synthesizer = null; // 語音合成器物件

        // --- DOM 元素快取 ---
        const wordDisplay = document.getElementById('word-display');
        const zhuyinInput = document.getElementById('zhuyin-input');
        const message = document.getElementById('message');
        const listenAgainBtn = document.getElementById('listen-again');
        const clearInputBtn = document.getElementById('clear-input');
        const checkAnswerBtn = document.getElementById('check-answer');
        const nextWordBtn = document.getElementById('next-word');

        // --- 核心功能函數 ---

        /** * 初始化語音合成器。
         * 如果瀏覽器支援 SpeechSynthesis，則初始化。
         */
        function initSpeechSynthesizer() {
            if ('speechSynthesis' in window) {
                synthesizer = window.speechSynthesis;
            } else {
                message.textContent = "注意：您的瀏覽器不支援語音播放功能。";
                listenAgainBtn.disabled = true;
            }
        }

        /** * 播放當前詞彙的發音。
         */
        function speakWord(text) {
            if (synthesizer && text) {
                // 停止任何正在進行的語音
                synthesizer.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW'; // 設定語言為台灣中文
                utterance.rate = 0.8; // 稍微慢一點，讓小朋友聽得更清楚
                utterance.pitch = 1.2; // 稍微高一點，更像卡通或童聲
                
                synthesizer.speak(utterance);
            }
        }

        /**
         * 隨機選取下一題並顯示。
         */
        function nextQuestion() {
            // 隨機選取一個題目
            const randomIndex = Math.floor(Math.random() * questions.length);
            currentQuestion = questions[randomIndex];

            // 1. 清空輸入框和回饋訊息
            clearInput();
            message.textContent = "請聽發音，然後輸入注音！";
            message.style.color = '#ff69b4';

            // 2. 顯示文字 (給小朋友知道是哪個詞)
            wordDisplay.textContent = currentQuestion.word;

            // 3. 播放發音
            speakWord(currentQuestion.pronunciation);
            
            // 讓輸入框自動聚焦，方便小朋友直接輸入
            zhuyinInput.focus();
        }

        /** * 檢查使用者輸入的注音是否正確。
         */
        function checkAnswer() {
            if (!currentQuestion) {
                message.textContent = "請點擊「下一題」開始練習！";
                return;
            }
            
            const userInput = zhuyinInput.value.trim().toLowerCase();
            const correctAnswer = currentQuestion.zhuyin.toLowerCase();

            if (userInput === correctAnswer) {
                message.textContent = `🎉 答對了！「${currentQuestion.word}」的注音是 ${correctAnswer}！`;
                message.style.color = '#4CAF50'; // 綠色 (答對)
                // 播放「答對了」的語音
                speakWord('答對了！');
                // 延遲一段時間後自動換下一題
                setTimeout(nextQuestion, 2000); 

            } else {
                // 如果是空字串，給出提示
                if (userInput === '') {
                    message.textContent = `🤔 請輸入注音符號，例如：ㄅㄚˋ`;
                    message.style.color = '#FF9800'; // 橘色
                } else {
                    message.textContent = `❌ 錯囉！再試試看，或點「下一題」看答案。`;
                    message.style.color = '#F44336'; // 紅色 (答錯)
                }
                
                // 播放「答錯了」的語音
                speakWord('錯了，再試試看');
            }
        }
        
        /**
         * 清空輸入框內容。 (對應「全部清除」功能)
         */
        function clearInput() {
            zhuyinInput.value = '';
            zhuyinInput.focus();
        }

        // --- 事件監聽器 (Listener) ---

        // 1. 初始化語音
        initSpeechSynthesizer();

        // 2. 「再聽一次」按鈕
        listenAgainBtn.addEventListener('click', () => {
            if (currentQuestion) {
                speakWord(currentQuestion.pronunciation);
            }
        });

        // 3. 「全部清除」按鈕
        clearInputBtn.addEventListener('click', clearInput);

        // 4. 「送出答案」按鈕
        checkAnswerBtn.addEventListener('click', checkAnswer);
        
        // 5. 「下一題」按鈕
        nextWordBtn.addEventListener('click', nextQuestion);
        
        // 6. 輸入框支援 Enter 鍵送出
        zhuyinInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        });
        
        // 預載入第一道題目
        nextQuestion();
    </script>
</body>
</html>
